name: Update matches.json

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch matches from xoiche
        run: |
          python3 << 'PY'
          import json, urllib.request, time, ssl
          from urllib.parse import urlparse

          CTX = ssl.create_default_context()
          ALLOWED = ("xoiche.live", "www.xoiche.live")

          def host_ok(url):
              try:
                  p = urlparse(url)
                  return p.scheme == "https" and (p.hostname or "").lower() in ALLOWED
              except Exception:
                  return False

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not host_ok(newurl):
                      raise urllib.error.HTTPError(newurl, code, "redirect host blocked", headers, fp)
                  return urllib.request.HTTPRedirectHandler.redirect_request(
                      self, req, fp, code, msg, headers, newurl
                  )

          opener = urllib.request.build_opener(SafeRedirect(), urllib.request.HTTPSHandler(context=CTX))

          def get(url):
              if not host_ok(url):
                  raise ValueError("host not allowed: " + url[:80])
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 SportsH-Bot",
                  "Accept": "application/json",
              })
              with opener.open(req, timeout=30) as r:
                  return json.load(r)

          base = "https://xoiche.live"
          url = base + "/api/matches/?ordering=smart&page_size=100&site=xoiche"
          results = []
          for _ in range(8):
              data = get(url)
              results.extend(data.get("results") or [])
              nxt = data.get("next")
              if not nxt:
                  break
              cand = nxt if str(nxt).startswith("http") else base + str(nxt)
              if not host_ok(cand):
                  print("skip next host", cand[:80])
                  break
              url = cand
              time.sleep(0.2)

          def has_stream(m):
              def ok(u):
                  return u and ".m3u8" in str(u)
              if ok(m.get("primary_stream_url")) or ok(m.get("backup_stream_url")):
                  return True
              for c in m.get("commentators") or []:
                  if ok(c.get("stream_url")) or ok(c.get("flv_stream_url")):
                      return True
              for c in m.get("commentator_streams") or []:
                  if ok(c.get("stream_url")):
                      return True
                  if ok((c.get("commentator") or {}).get("stream_url")):
                      return True
              return False

          def is_relevant(m):
              st = str(m.get("status") or "").lower()
              if st in ("live", "inplay", "1h", "2h", "ht", "half_time", "halftime"):
                  return True
              if st in ("finished", "ft", "after_pen", "after_et", "postponed", "cancelled"):
                  return has_stream(m)
              return True

          watch = [m for m in results if is_relevant(m)]
          # SH-15: không ghi đè matches.json bằng danh sách rỗng (API lỗi)
          if not watch and results:
              # Có data nhưng filter hết — vẫn ghi (có thể hết trận)
              pass
          if not results:
              print("WARN: xoiche returned 0 results — keep previous matches.json")
              raise SystemExit(0)
          out = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "count": len(watch),
              "results": watch,
          }
          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("saved", len(watch), "matches")
          PY

      - name: Fetch channels (M3U + Hội Quán + Thiên Đình)
        if: always()
        run: |
          python3 << 'PY'
          import json, urllib.request, time, re, ssl, os
          from datetime import datetime, timedelta
          from urllib.parse import urlparse

          # Xác minh TLS đầy đủ (không tắt CERT)
          CTX = ssl.create_default_context()

          # Hostname cụ thể (không tin mọi subdomain onrender.com)
          ALLOWED_HOSTS = {
              "bongda-1.onrender.com",
              "api.cltvlv.com",
              "live-api.keonhacaitp.one",
              "sv.hoiquantv.xyz",
              "sv.thiendinhtv.xyz",
              "sv.bugiotv.xyz",
              "api.plapi202624081158.com",
              "xoiche.live",
              "www.xoiche.live",
              "gavangtv-api.adviceme.io",
              "api.gvapi.cc",
          }

          def host_allowed(url):
              try:
                  p = urlparse(url)
                  if p.scheme != "https" or not p.hostname:
                      return False
                  return p.hostname.lower() in ALLOWED_HOSTS
              except Exception:
                  return False

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not host_allowed(newurl):
                      raise urllib.error.HTTPError(newurl, code, "redirect host blocked", headers, fp)
                  return urllib.request.HTTPRedirectHandler.redirect_request(
                      self, req, fp, code, msg, headers, newurl
                  )

          opener = urllib.request.build_opener(
              SafeRedirect(), urllib.request.HTTPSHandler(context=CTX)
          )

          def get_bytes(url, timeout=45):
              if not host_allowed(url):
                  raise ValueError("host not allowed: " + url[:80])
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) SportsH-Bot",
                  "Accept": "application/json, text/plain, */*",
              })
              with opener.open(req, timeout=timeout) as r:
                  return r.read()

          def get_text(url):
              return get_bytes(url).decode("utf-8", "replace")

          def get_json(url):
              return json.loads(get_bytes(url).decode("utf-8", "replace"))

          def parse_m3u(text, source):
              out = []
              cur = None
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith("#EXTINF:"):
                      comma = line.find(",")
                      meta = line[:comma] if comma >= 0 else line
                      name = line[comma+1:].strip() if comma >= 0 else "Kênh"
                      g = re.search(r'group-title="([^"]*)"', meta, re.I)
                      l = re.search(r'tvg-logo="([^"]*)"', meta, re.I)
                      cur = {
                          "name": name,
                          "group": g.group(1) if g else "",
                          "logo": l.group(1) if l else "",
                          "source": source,
                          "url": "",
                      }
                  elif not line.startswith("#") and cur is not None:
                      if line.startswith("http"):
                          cur["url"] = line
                          out.append(cur)
                      cur = None
              return out

          def pick_stream_url(obj):
              """Tìm URL m3u8 trong object / list lồng nhau."""
              if not obj:
                  return None
              candidates = []
              def walk(x, depth=0):
                  if depth > 6 or x is None:
                      return
                  if isinstance(x, str):
                      if x.startswith("http") and (".m3u8" in x or "m3u8" in x):
                          candidates.append(x)
                      return
                  if isinstance(x, dict):
                      for k in ("sourceUrl", "stream_url", "streamUrl", "playStreamAddress2",
                                "playStreamAddress", "url", "link", "streamSourceFhd",
                                "streamSource", "flv_stream_url", "primary_stream_url"):
                          v = x.get(k)
                          if isinstance(v, str) and v.startswith("http"):
                              candidates.append(v)
                      for v in x.values():
                          walk(v, depth + 1)
                  elif isinstance(x, list):
                      for i in x:
                          walk(i, depth + 1)
              walk(obj)
              # Ưu tiên m3u8
              for c in candidates:
                  if ".m3u8" in c:
                      return c
              return candidates[0] if candidates else None

          def parse_fixture_api(data, source, label):
              out = []
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  for k in ("data", "results", "fixtures", "matches", "items"):
                      if k in data and data[k] is not None:
                          v = data[k]
                          if isinstance(v, list):
                              items = v
                          elif isinstance(v, dict):
                              items = list(v.values())
                          break
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  home = (item.get("homeTeam") or item.get("home_team") or {})
                  away = (item.get("awayTeam") or item.get("away_team") or {})
                  if isinstance(home, str):
                      home_name = home
                  else:
                      home_name = home.get("name") or home.get("teamName") or item.get("home_name") or "?"
                  if isinstance(away, str):
                      away_name = away
                  else:
                      away_name = away.get("name") or away.get("teamName") or item.get("away_name") or "?"
                  title = item.get("title") or item.get("name") or f"{home_name} VS {away_name}"
                  league = ""
                  for lk in ("league", "tournament", "competition"):
                      lv = item.get(lk)
                      if isinstance(lv, dict):
                          league = lv.get("name") or ""
                      elif isinstance(lv, str):
                          league = lv
                      if league:
                          break
                  # thời gian
                  ts = item.get("matchTime") or item.get("start_time") or item.get("kickoff") or item.get("startTime")
                  time_label = ""
                  if isinstance(ts, (int, float)) and ts > 1e9:
                      try:
                          time_label = datetime.fromtimestamp(ts if ts < 1e12 else ts/1000).strftime("%H:%M - %d/%m")
                      except Exception:
                          pass
                  elif isinstance(ts, str) and ts:
                      time_label = ts[:16]
                  blv = ""
                  streams_block = (
                      item.get("streams")
                      or item.get("commentators")
                      or item.get("anchorAppointmentVoList")
                      or item.get("commentator")
                      or item
                  )
                  if isinstance(streams_block, list) and streams_block:
                      first = streams_block[0]
                      if isinstance(first, dict):
                          blv = first.get("name") or first.get("commentatorName") or first.get("nickName") or ""
                  url = pick_stream_url(streams_block) or pick_stream_url(item)
                  if not url:
                      continue
                  name = title
                  if time_label:
                      name = f"{time_label} | {title}"
                  if blv:
                      name = f"{name} | {blv}"
                  logo = ""
                  if isinstance(home, dict):
                      logo = home.get("logoUrl") or home.get("logo") or ""
                  out.append({
                      "name": name,
                      "group": league or label,
                      "logo": logo,
                      "source": source,
                      "url": url,
                  })
              return out

          all_ch = []
          seen = set()

          def add_items(items, tag):
              n = 0
              for ch in items:
                  u = ch.get("url") or ""
                  if not u or u in seen:
                      continue
                  seen.add(u)
                  all_ch.append(ch)
                  n += 1
              print(tag, n)

          # 1) M3U từ bongda-1
          m3u_sources = {
              "giovang": "https://bongda-1.onrender.com/giovang.m3u",
              "cola": "https://bongda-1.onrender.com/cola.m3u",
              "phalang": "https://bongda-1.onrender.com/phalang.m3u",
          }
          for k, url in m3u_sources.items():
              try:
                  add_items(parse_m3u(get_text(url), k), k)
              except Exception as e:
                  print("ERR", k, e)

          # 2) API Hội Quán / Thiên Đình / Vòng Cấm
          json_sources = [
              ("hoiquan", "https://sv.hoiquantv.xyz/api/v1/external/fixtures/unfinished", "Hội Quán"),
              ("thiendinh", "https://sv.thiendinhtv.xyz/api/v1/external/fixtures/unfinished", "Thiên Đình"),
              ("vongcam", "https://sv.bugiotv.xyz/internal/api/matches", "Vòng Cấm"),
          ]
          for key, url, label in json_sources:
              try:
                  data = get_json(url)
                  items = parse_fixture_api(data, key, label)
                  add_items(items, key)
              except Exception as e:
                  print("ERR", key, e)

          # 3) Gà Vàng + Cola API (dict theo slug trận)
          def parse_gavang_style(data, source, label):
              out = []
              root = data.get("data") if isinstance(data, dict) else data
              if isinstance(root, dict):
                  items = list(root.values())
              elif isinstance(root, list):
                  items = root
              else:
                  items = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  # API Gà Vàng: homeTeam/awayTeam là object {name, logo}
                  ht = item.get("homeTeam") if isinstance(item.get("homeTeam"), dict) else {}
                  at = item.get("awayTeam") if isinstance(item.get("awayTeam"), dict) else {}
                  home = (
                      item.get("homeTeamName")
                      or item.get("home_name")
                      or ht.get("name")
                      or ""
                  )
                  away = (
                      item.get("awayTeamName")
                      or item.get("away_name")
                      or at.get("name")
                      or ""
                  )
                  if not home or not away or home == "?" or away == "?":
                      continue
                  logo = (
                      item.get("homeTeamLogo")
                      or item.get("home_logo")
                      or ht.get("logo")
                      or ""
                  )
                  comp = item.get("competition")
                  if isinstance(comp, dict):
                      league = comp.get("name") or comp.get("title") or label
                  else:
                      league = item.get("leagueName") or item.get("tournamentName") or (comp if isinstance(comp, str) else label)
                  # thời gian: ưu tiên matchNormalizedDate ("14:45 04/11")
                  time_label = (
                      item.get("matchNormalizedDate")
                      or item.get("matchNormalizedTime")
                      or ""
                  )
                  if not time_label:
                      ts = item.get("matchTime") or item.get("startTime")
                      if isinstance(ts, (int, float)) and ts > 1e9:
                          try:
                              tsv = ts if ts < 1e12 else ts / 1000
                              time_label = (datetime.utcfromtimestamp(tsv) + timedelta(hours=7)).strftime("%H:%M - %d/%m")
                          except Exception:
                              pass
                  # streams từ BLV
                  blv = ""
                  stream_url = None
                  for a in item.get("anchorAppointmentVoList") or []:
                      if not isinstance(a, dict):
                          continue
                      blv = blv or a.get("nickName") or a.get("name") or ""
                      for u in a.get("streamUrls") or []:
                          if isinstance(u, str) and u.startswith("http") and ".m3u8" in u:
                              stream_url = u
                              break
                      if stream_url:
                          break
                      for s in a.get("servers") or []:
                          if isinstance(s, dict):
                              u = s.get("url") or s.get("sourceUrl") or ""
                          else:
                              u = str(s or "")
                          if u.startswith("http") and ".m3u8" in u:
                              stream_url = u
                              break
                      if stream_url:
                          break
                  if not stream_url:
                      for k in ("streamUrl", "playUrl", "url", "m3u8", "defaultLink"):
                          u = item.get(k)
                          if isinstance(u, str) and u.startswith("http") and ".m3u8" in u:
                              stream_url = u
                              break
                  if not stream_url:
                      continue
                  title = f"{home} VS {away}"
                  name = title
                  if time_label:
                      # chuẩn hoá "14:45 04/11" → "14:45 - 04/11"
                      tl = str(time_label).strip()
                      if " - " not in tl and " " in tl:
                          tl = tl.replace(" ", " - ", 1)
                      name = f"{tl} | {title}"
                  if blv:
                      name = f"{name} | {blv}"
                  if league and league != label:
                      name = name.replace(title, f"{title} ({league})", 1)
                  out.append({
                      "name": name,
                      "group": league or label,
                      "logo": logo if isinstance(logo, str) else "",
                      "source": source,
                      "url": stream_url,
                  })
              return out

          # Ưu tiên adviceme (đúng cặp đội). gvapi.cc đôi khi sai tên (vd Bình Phước thay Đồng Nai).
          gavang_primary = [
              ("gavang", "https://gavangtv-api.adviceme.io/api/v1/matches?webType=gavang", "Gà Vàng"),
              ("cola", "https://gavangtv-api.adviceme.io/api/v1/matches?webType=cola", "Cola"),
          ]
          gavang_counts = {}
          for key, url, label in gavang_primary:
              try:
                  data = get_json(url)
                  items = parse_gavang_style(data, key, label)
                  add_items(items, key + "-api")
                  gavang_counts[key] = len(items)
                  print("OK", key, len(items))
              except Exception as e:
                  print("ERR", key, url[:40], e)
                  gavang_counts[key] = 0
          # Fallback gvapi chỉ khi primary Gà Vàng về 0 trận
          if gavang_counts.get("gavang", 0) == 0:
              try:
                  data = get_json("https://api.gvapi.cc/api/matches")
                  items = parse_gavang_style(data, "gavang", "Gà Vàng")
                  add_items(items, "gavang-api-fallback")
                  print("OK gavang-fallback", len(items))
              except Exception as e:
                  print("ERR gavang-fallback", e)

          # SH-16/SH-17/SH-26: validate stream URL (HLS HTTPS only)
          import ipaddress

          def validate_stream_url(u):
              try:
                  p = urlparse(u)
                  if p.scheme != "https":
                      return False
                  if not p.hostname or p.username or p.password:
                      return False
                  try:
                      ip = ipaddress.ip_address(p.hostname)
                      if not ip.is_global:
                          return False
                  except ValueError:
                      pass  # hostname DNS — OK
                  path = (p.path or "").lower()
                  if not path.endswith(".m3u8"):
                      return False
                  if path.endswith(".flv"):
                      return False
                  return True
              except Exception:
                  return False

          # SH-22: tách stream vs event_link (không trộn upcoming page vào channels)
          streams = []
          event_links = []
          for ch in all_ch:
              u = ch.get("url") or ""
              item = dict(ch)
              if validate_stream_url(u):
                  item["type"] = "stream"
                  streams.append(item)
              elif u.startswith("https://") and "/upcoming/" in u:
                  item["type"] = "event_link"
                  event_links.append(item)
              else:
                  print("drop url", u[:80])

          # SH-15/SH-23: Quality Gate — so sánh cùng loại (streams vs streams)
          MIN_STREAMS = 5
          MIN_RETENTION_RATIO = 0.50
          prev_stream_count = 0
          prev_event_count = 0
          try:
              with open("channels.json", "r", encoding="utf-8") as f:
                  prev = json.load(f)
              if isinstance(prev.get("streams"), list):
                  prev_stream_count = len(prev["streams"])
              else:
                  # Migration: snapshot cũ — chỉ đếm URL .m3u8
                  old = prev.get("channels") or []
                  prev_stream_count = sum(
                      1 for c in old
                      if str((c or {}).get("url") or "").lower().split("?")[0].endswith(".m3u8")
                  )
              if isinstance(prev.get("event_links"), list):
                  prev_event_count = len(prev["event_links"])
          except Exception:
              prev_stream_count = 0
              prev_event_count = 0

          status = "updated"
          reason = "ok"
          if len(streams) < MIN_STREAMS:
              status = "skipped_quality_gate"
              reason = "insufficient_valid_streams"
          elif prev_stream_count and len(streams) < prev_stream_count * MIN_RETENTION_RATIO:
              status = "skipped_quality_gate"
              reason = "unexpected_stream_count_drop"

          print(
              "gate", status, reason,
              "streams", len(streams), "prev_streams", prev_stream_count,
              "events", len(event_links), "prev_events", prev_event_count,
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY") or "/dev/null"
          with open(summary_path, "a", encoding="utf-8") as sm:
              sm.write(
                  "### Channels quality gate\n"
                  f"- status: `{status}`\n"
                  f"- reason: `{reason}`\n"
                  f"- current_stream_count: {len(streams)}\n"
                  f"- previous_stream_count: {prev_stream_count}\n"
                  f"- current_event_count: {len(event_links)}\n"
                  f"- previous_event_count: {prev_event_count}\n"
                  f"- previous_snapshot_preserved: {status != 'updated'}\n"
              )

          if status != "updated":
              raise SystemExit(0)

          out = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "count": len(streams),
              "channels": streams,
              "streams": streams,
              "event_links": event_links,
          }
          with open("channels.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("saved", len(streams), "streams,", len(event_links), "event_links")
          PY

      # Commit độc lập theo file đã đổi (matches / channels có thể cập nhật riêng)
      - name: Commit data files
        if: always()
        run: |
          git config user.name "SportsH Bot"
          git config user.email "bot@sportsh.local"
          CHANGED=""
          if git diff --quiet matches.json 2>/dev/null; then
            true
          else
            git add matches.json
            CHANGED="$CHANGED matches"
          fi
          if git diff --quiet channels.json 2>/dev/null; then
            true
          else
            git add channels.json
            CHANGED="$CHANGED channels"
          fi
          if [ -z "$CHANGED" ]; then
            echo "No data file changes to commit"
            exit 0
          fi
          git commit -m "chore: update$CHANGED"
          git push
          echo "Committed:$CHANGED"
