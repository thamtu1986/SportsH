name: Update matches.json

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch matches from xoiche
        run: |
          python3 << 'PY'
          import json, urllib.request, time, ssl
          from urllib.parse import urlparse

          CTX = ssl.create_default_context()
          ALLOWED = ("xoiche.live", "www.xoiche.live")

          def host_ok(url):
              try:
                  p = urlparse(url)
                  return p.scheme == "https" and (p.hostname or "").lower() in ALLOWED
              except Exception:
                  return False

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not host_ok(newurl):
                      raise urllib.error.HTTPError(newurl, code, "redirect host blocked", headers, fp)
                  return urllib.request.HTTPRedirectHandler.redirect_request(
                      self, req, fp, code, msg, headers, newurl
                  )

          opener = urllib.request.build_opener(SafeRedirect(), urllib.request.HTTPSHandler(context=CTX))

          def get(url):
              if not host_ok(url):
                  raise ValueError("host not allowed: " + url[:80])
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 SportsH-Bot",
                  "Accept": "application/json",
              })
              with opener.open(req, timeout=30) as r:
                  return json.load(r)

          base = "https://xoiche.live"
          url = base + "/api/matches/?ordering=smart&page_size=100&site=xoiche"
          results = []
          for _ in range(8):
              data = get(url)
              results.extend(data.get("results") or [])
              nxt = data.get("next")
              if not nxt:
                  break
              cand = nxt if str(nxt).startswith("http") else base + str(nxt)
              if not host_ok(cand):
                  print("skip next host", cand[:80])
                  break
              url = cand
              time.sleep(0.2)

          def has_stream(m):
              def ok(u):
                  return u and ".m3u8" in str(u)
              if ok(m.get("primary_stream_url")) or ok(m.get("backup_stream_url")):
                  return True
              for c in m.get("commentators") or []:
                  if ok(c.get("stream_url")) or ok(c.get("flv_stream_url")):
                      return True
              for c in m.get("commentator_streams") or []:
                  if ok(c.get("stream_url")):
                      return True
                  if ok((c.get("commentator") or {}).get("stream_url")):
                      return True
              return False

          def is_relevant(m):
              st = str(m.get("status") or "").lower()
              if st in ("live", "inplay", "1h", "2h", "ht", "half_time", "halftime"):
                  return True
              if st in ("finished", "ft", "after_pen", "after_et", "postponed", "cancelled"):
                  return has_stream(m)
              return True

          watch = [m for m in results if is_relevant(m)]
          # SH-15: không ghi đè matches.json bằng danh sách rỗng (API lỗi)
          if not watch and results:
              # Có data nhưng filter hết — vẫn ghi (có thể hết trận)
              pass
          if not results:
              print("WARN: xoiche returned 0 results — keep previous matches.json")
              raise SystemExit(0)
          out = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "count": len(watch),
              "results": watch,
          }
          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("saved", len(watch), "matches")
          PY

      - name: Fetch channels (M3U + Hội Quán + Thiên Đình)
        if: always()
        run: |
          python3 << 'PY'
          import json, urllib.request, time, re, ssl, os
          from datetime import datetime, timedelta
          from urllib.parse import urlparse

          # Xác minh TLS đầy đủ (không tắt CERT)
          CTX = ssl.create_default_context()

          # Hostname cụ thể (không tin mọi subdomain onrender.com)
          ALLOWED_HOSTS = {
              "bongda-1.onrender.com",
              "api.cltvlv.com",
              "live-api.keonhacaitp.one",
              "sv.hoiquantv.xyz",
              "sv.thiendinhtv.xyz",
              "sv.bugiotv.xyz",
              "api.plapi202624081158.com",
              "xoiche.live",
              "www.xoiche.live",
              "gavangtv-api.adviceme.io",
              "api.gvapi.cc",
              "thtt.pages.dev",
              "billiards.sooplive.com",
          }

          def host_allowed(url):
              try:
                  p = urlparse(url)
                  if p.scheme != "https" or not p.hostname:
                      return False
                  return p.hostname.lower() in ALLOWED_HOSTS
              except Exception:
                  return False

          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if not host_allowed(newurl):
                      raise urllib.error.HTTPError(newurl, code, "redirect host blocked", headers, fp)
                  return urllib.request.HTTPRedirectHandler.redirect_request(
                      self, req, fp, code, msg, headers, newurl
                  )

          opener = urllib.request.build_opener(
              SafeRedirect(), urllib.request.HTTPSHandler(context=CTX)
          )

          def get_bytes(url, timeout=45):
              if not host_allowed(url):
                  raise ValueError("host not allowed: " + url[:80])
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) SportsH-Bot",
                  "Accept": "application/json, text/plain, */*",
              })
              with opener.open(req, timeout=timeout) as r:
                  return r.read()

          def get_text(url):
              return get_bytes(url).decode("utf-8", "replace")

          def get_json(url):
              return json.loads(get_bytes(url).decode("utf-8", "replace"))

          def parse_m3u(text, source):
              out = []
              cur = None
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith("#EXTINF:"):
                      comma = line.find(",")
                      meta = line[:comma] if comma >= 0 else line
                      name = line[comma+1:].strip() if comma >= 0 else "Kênh"
                      g = re.search(r'group-title="([^"]*)"', meta, re.I)
                      l = re.search(r'tvg-logo="([^"]*)"', meta, re.I)
                      cur = {
                          "name": name,
                          "group": g.group(1) if g else "",
                          "logo": l.group(1) if l else "",
                          "source": source,
                          "url": "",
                      }
                  elif not line.startswith("#") and cur is not None:
                      if line.startswith("http"):
                          cur["url"] = line
                          out.append(cur)
                      cur = None
              return out

          def pick_stream_url(obj):
              """Tìm URL m3u8 trong object / list lồng nhau."""
              if not obj:
                  return None
              candidates = []
              def walk(x, depth=0):
                  if depth > 6 or x is None:
                      return
                  if isinstance(x, str):
                      if x.startswith("http") and (".m3u8" in x or "m3u8" in x):
                          candidates.append(x)
                      return
                  if isinstance(x, dict):
                      for k in ("sourceUrl", "stream_url", "streamUrl", "playStreamAddress2",
                                "playStreamAddress", "url", "link", "streamSourceFhd",
                                "streamSource", "flv_stream_url", "primary_stream_url"):
                          v = x.get(k)
                          if isinstance(v, str) and v.startswith("http"):
                              candidates.append(v)
                      for v in x.values():
                          walk(v, depth + 1)
                  elif isinstance(x, list):
                      for i in x:
                          walk(i, depth + 1)
              walk(obj)
              # Ưu tiên m3u8
              for c in candidates:
                  if ".m3u8" in c:
                      return c
              return candidates[0] if candidates else None

          def parse_fixture_api(data, source, label):
              out = []
              items = []
              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  for k in ("data", "results", "fixtures", "matches", "items"):
                      if k in data and data[k] is not None:
                          v = data[k]
                          if isinstance(v, list):
                              items = v
                          elif isinstance(v, dict):
                              items = list(v.values())
                          break
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  home = (item.get("homeTeam") or item.get("home_team") or {})
                  away = (item.get("awayTeam") or item.get("away_team") or {})
                  if isinstance(home, str):
                      home_name = home
                  else:
                      home_name = home.get("name") or home.get("teamName") or item.get("home_name") or "?"
                  if isinstance(away, str):
                      away_name = away
                  else:
                      away_name = away.get("name") or away.get("teamName") or item.get("away_name") or "?"
                  title = item.get("title") or item.get("name") or f"{home_name} VS {away_name}"
                  league = ""
                  for lk in ("league", "tournament", "competition"):
                      lv = item.get(lk)
                      if isinstance(lv, dict):
                          league = lv.get("name") or ""
                      elif isinstance(lv, str):
                          league = lv
                      if league:
                          break
                  # thời gian
                  ts = item.get("matchTime") or item.get("start_time") or item.get("kickoff") or item.get("startTime")
                  time_label = ""
                  if isinstance(ts, (int, float)) and ts > 1e9:
                      try:
                          time_label = datetime.fromtimestamp(ts if ts < 1e12 else ts/1000).strftime("%H:%M - %d/%m")
                      except Exception:
                          pass
                  elif isinstance(ts, str) and ts:
                      time_label = ts[:16]
                  blv = ""
                  streams_block = (
                      item.get("streams")
                      or item.get("commentators")
                      or item.get("anchorAppointmentVoList")
                      or item.get("commentator")
                      or item
                  )
                  if isinstance(streams_block, list) and streams_block:
                      first = streams_block[0]
                      if isinstance(first, dict):
                          blv = first.get("name") or first.get("commentatorName") or first.get("nickName") or ""
                  url = pick_stream_url(streams_block) or pick_stream_url(item)
                  if not url:
                      continue
                  name = title
                  if time_label:
                      name = f"{time_label} | {title}"
                  if blv:
                      name = f"{name} | {blv}"
                  logo = ""
                  if isinstance(home, dict):
                      logo = home.get("logoUrl") or home.get("logo") or ""
                  out.append({
                      "name": name,
                      "group": league or label,
                      "logo": logo,
                      "source": source,
                      "url": url,
                  })
              return out

          all_ch = []
          seen = set()

          def add_items(items, tag):
              n = 0
              for ch in items:
                  u = ch.get("url") or ""
                  if not u:
                      continue
                  if u in seen:
                      # Cập nhật nếu bản mới có tỷ số mà bản cũ không
                      for i, old in enumerate(all_ch):
                          if (old.get("url") or "") == u:
                              if old.get("home_score") is None and ch.get("home_score") is not None:
                                  all_ch[i] = dict(old)
                                  for k in ("home_score", "away_score", "match_status", "start_time", "name"):
                                      if ch.get(k) is not None:
                                          all_ch[i][k] = ch.get(k)
                                  n += 1
                              break
                      continue
                  seen.add(u)
                  all_ch.append(ch)
                  n += 1
              print(tag, n)

          # 1) M3U từ bongda-1
          m3u_sources = {
              "giovang": "https://bongda-1.onrender.com/giovang.m3u",
              "cola": "https://bongda-1.onrender.com/cola.m3u",
              "phalang": "https://bongda-1.onrender.com/phalang.m3u",
          }
          for k, url in m3u_sources.items():
              try:
                  add_items(parse_m3u(get_text(url), k), k)
              except Exception as e:
                  print("ERR", k, e)


          # 1a) Aggregator thtt.pages.dev — nhiều nguồn kiểu Kienplayer (Giờ Vàng, Cola, Xôi Lạc…)
          def source_from_group(group, name=""):
              g = (group + " " + name).lower()
              if "cola" in g:
                  return "cola"
              if "giờ vàng" in g or "giovang" in g or "gio vang" in g:
                  return "giovang"
              if "phá làng" in g or "phalang" in g or "pha lang" in g:
                  return "phalang"
              if "gà vàng" in g or "ga vang" in g or "khô gà" in g or "kho ga" in g:
                  return "gavang"
              if "xôi lạc" in g or "xoi lac" in g or "xôi gấc" in g:
                  return "xoilac"
              if "chuối" in g or "chuoi" in g:
                  return "chuoichien"
              if "sao kê" in g or "sao ke" in g:
                  return "saoke"
              if "sút bóng" in g or "sut bong" in g:
                  return "sutbong"
              if "bia ôm" in g or "bia om" in g:
                  return "biaom"
              if "vua sân" in g or "vua san" in g:
                  return "vuasan"
              if "s8" in g:
                  return "s8tv"
              return "thtt"

          try:
              thtt = get_text("https://thtt.pages.dev/tttt.m3u")
              import re as _re
              cur_name, cur_logo, cur_group = None, "", ""
              items = []
              for line in thtt.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#EXTM3U"):
                      continue
                  if line.startswith("#EXTINF"):
                      cur_logo, cur_group = "", ""
                      lm = _re.search(r'tvg-logo="([^"]*)"', line)
                      if lm:
                          cur_logo = lm.group(1)
                      gm = _re.search(r'group-title="([^"]*)"', line)
                      if gm:
                          cur_group = gm.group(1)
                      parts = line.split(",", 1)
                      cur_name = parts[1].strip() if len(parts) > 1 else "Live"
                      # bỏ dòng meta Updated
                      if cur_group.lower().startswith("updated") or (cur_name and cur_name.lower().startswith("updated")):
                          cur_name = None
                      continue
                  if line.startswith("http") and cur_name:
                      url = line.split()[0]
                      if "no-signal" in url or ".m3u8" not in url.lower():
                          cur_name = None
                          continue
                      src = source_from_group(cur_group, cur_name)
                      items.append({
                          "name": cur_name,
                          "group": cur_group or src,
                          "logo": cur_logo,
                          "source": src,
                          "url": url,
                      })
                      cur_name = None
              add_items(items, "thtt-m3u")
              print("OK thtt-m3u", len(items))
          except Exception as e:
              print("ERR thtt-m3u", e)


          # 1b) live.m3u gộp — bổ sung kênh có .m3u8 chưa có (gán nguồn theo group-title)
          try:
              live_txt = get_text("https://bongda-1.onrender.com/live.m3u")
              # tái dùng parse nhưng gán source theo group
              import re as _re
              cur_name, cur_logo, cur_group = None, "", ""
              extra_n = 0
              for line in live_txt.splitlines():
                  line = line.strip()
                  if line.startswith("#EXTINF"):
                      cur_logo = ""
                      cur_group = ""
                      lm = _re.search(r'tvg-logo="([^"]*)"', line)
                      if lm:
                          cur_logo = lm.group(1)
                      gm = _re.search(r'group-title="([^"]*)"', line)
                      if gm:
                          cur_group = gm.group(1)
                      parts = line.split(",", 1)
                      cur_name = parts[1].strip() if len(parts) > 1 else "Live"
                  elif line.startswith("http") and cur_name:
                      url = line.split()[0]
                      if ".m3u8" not in url.lower():
                          cur_name = None
                          continue
                      g = (cur_group + " " + cur_name).lower()
                      if any(x in g for x in ("cola", "cltv")):
                          src = "cola"
                      elif any(x in g for x in ("pha", "phalang", "phải lang")):
                          src = "phalang"
                      elif any(x in g for x in ("giờ vàng", "giovang", "gio vang", "vàng tv")):
                          src = "giovang"
                      else:
                          # Không đoán thương hiệu — gắn thtt
                          src = "thtt"
                      before = len(seen)
                      add_items([{
                          "name": cur_name,
                          "group": cur_group or src,
                          "logo": cur_logo,
                          "source": src,
                          "url": url,
                      }], "live-hub")
                      if len(seen) > before:
                          extra_n += 1
                      cur_name = None
              print("live-hub added", extra_n)
          except Exception as e:
              print("ERR live-hub", e)

          # 1c) Cola API trực tiếp (api.cltvlv.com) — bổ sung khi M3U thiếu BLV m3u8
          try:
              data = get_json("https://api.cltvlv.com/api/matches")
              blob = data.get("data") if isinstance(data, dict) else data
              items = []
              if isinstance(blob, dict):
                  rows = list(blob.values())
              elif isinstance(blob, list):
                  rows = blob
              else:
                  rows = []
              def cola_score(arr):
                  if isinstance(arr, list) and arr:
                      try:
                          return int(arr[0])
                      except Exception:
                          return None
                  if isinstance(arr, (int, float)):
                      return int(arr)
                  return None

              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  home = row.get("homeTeamName") or "?"
                  away = row.get("awayTeamName") or "?"
                  league = row.get("competitionName") or "Cola"
                  logo = row.get("homeTeamLogo") or row.get("competitionLogo") or ""
                  hs = cola_score(row.get("homeScore"))
                  aws = cola_score(row.get("awayScore"))
                  # matchStatus: 1 scheduled, 2 live, 3 finished (quan sát thực tế API)
                  ms_code = row.get("matchStatus")
                  if ms_code == 2:
                      mstatus = "live"
                  elif ms_code == 3:
                      mstatus = "finished"
                  else:
                      mstatus = "scheduled"
                  start_iso = None
                  mt = row.get("matchTime")
                  if isinstance(mt, (int, float)) and mt > 1e9:
                      start_iso = datetime.fromtimestamp(int(mt), tz=timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                  # nhãn giờ VN trong name để channelToMatch parse
                  time_label = ""
                  if start_iso:
                      try:
                          from datetime import timedelta
                          vn = datetime.fromtimestamp(int(mt), tz=timezone.utc) + timedelta(hours=7)
                          time_label = vn.strftime("%H:%M - %d/%m")
                      except Exception:
                          time_label = ""
                  urls = []
                  vu = row.get("videoUrl") or ""
                  if isinstance(vu, str) and ".m3u8" in vu:
                      urls.append(vu)
                  for a in row.get("anchorAppointmentVoList") or []:
                      if not isinstance(a, dict):
                          continue
                      for k in ("playStreamAddress2", "playStreamAddress", "streamUrl"):
                          u = a.get(k) or ""
                          if isinstance(u, str) and ".m3u8" in u:
                              urls.append(u)
                              break
                  for u in urls:
                      blv = ""
                      for a in row.get("anchorAppointmentVoList") or []:
                          if isinstance(a, dict) and (a.get("playStreamAddress2") == u or a.get("playStreamAddress") == u):
                              blv = a.get("nickName") or ""
                              break
                      if time_label:
                          name = f"{time_label} | {home} VS {away}"
                      else:
                          name = f"{home} VS {away}"
                      if blv:
                          name += f" | {blv}"
                      items.append({
                          "name": name,
                          "group": league,
                          "logo": logo if isinstance(logo, str) else "",
                          "source": "cola",
                          "url": u,
                          "home_score": hs,
                          "away_score": aws,
                          "match_status": mstatus,
                          "start_time": start_iso,
                      })
              add_items(items, "cola-api-cltvlv")
              print("OK cola-api-cltvlv", len(items))
          except Exception as e:
              print("ERR cola-api-cltvlv", e)

          # 2) API Hội Quán / Thiên Đình / Vòng Cấm
          json_sources = [
              ("hoiquan", "https://sv.hoiquantv.xyz/api/v1/external/fixtures/unfinished", "Hội Quán"),
              ("thiendinh", "https://sv.thiendinhtv.xyz/api/v1/external/fixtures/unfinished", "Thiên Đình"),
              ("vongcam", "https://sv.bugiotv.xyz/internal/api/matches", "Vòng Cấm"),
          ]
          for key, url, label in json_sources:
              try:
                  data = get_json(url)
                  items = parse_fixture_api(data, key, label)
                  add_items(items, key)
              except Exception as e:
                  print("ERR", key, e)

          # 3) Gà Vàng + Cola API (dict theo slug trận)
          def parse_gavang_style(data, source, label):
              out = []
              root = data.get("data") if isinstance(data, dict) else data
              if isinstance(root, dict):
                  items = list(root.values())
              elif isinstance(root, list):
                  items = root
              else:
                  items = []
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  # API Gà Vàng: homeTeam/awayTeam là object {name, logo}
                  ht = item.get("homeTeam") if isinstance(item.get("homeTeam"), dict) else {}
                  at = item.get("awayTeam") if isinstance(item.get("awayTeam"), dict) else {}
                  home = (
                      item.get("homeTeamName")
                      or item.get("home_name")
                      or ht.get("name")
                      or ""
                  )
                  away = (
                      item.get("awayTeamName")
                      or item.get("away_name")
                      or at.get("name")
                      or ""
                  )
                  if not home or not away or home == "?" or away == "?":
                      continue
                  logo = (
                      item.get("homeTeamLogo")
                      or item.get("home_logo")
                      or ht.get("logo")
                      or ""
                  )
                  comp = item.get("competition")
                  if isinstance(comp, dict):
                      league = comp.get("name") or comp.get("title") or label
                  else:
                      league = item.get("leagueName") or item.get("tournamentName") or (comp if isinstance(comp, str) else label)
                  # thời gian: ưu tiên matchNormalizedDate ("14:45 04/11")
                  time_label = (
                      item.get("matchNormalizedDate")
                      or item.get("matchNormalizedTime")
                      or ""
                  )
                  if not time_label:
                      ts = item.get("matchTime") or item.get("startTime")
                      if isinstance(ts, (int, float)) and ts > 1e9:
                          try:
                              tsv = ts if ts < 1e12 else ts / 1000
                              time_label = (datetime.utcfromtimestamp(tsv) + timedelta(hours=7)).strftime("%H:%M - %d/%m")
                          except Exception:
                              pass
                  # streams từ BLV
                  blv = ""
                  stream_url = None
                  for a in item.get("anchorAppointmentVoList") or []:
                      if not isinstance(a, dict):
                          continue
                      blv = blv or a.get("nickName") or a.get("name") or ""
                      for u in a.get("streamUrls") or []:
                          if isinstance(u, str) and u.startswith("http") and ".m3u8" in u:
                              stream_url = u
                              break
                      if stream_url:
                          break
                      for s in a.get("servers") or []:
                          if isinstance(s, dict):
                              u = s.get("url") or s.get("sourceUrl") or ""
                          else:
                              u = str(s or "")
                          if u.startswith("http") and ".m3u8" in u:
                              stream_url = u
                              break
                      if stream_url:
                          break
                  if not stream_url:
                      for k in ("streamUrl", "playUrl", "url", "m3u8", "defaultLink"):
                          u = item.get(k)
                          if isinstance(u, str) and u.startswith("http") and ".m3u8" in u:
                              stream_url = u
                              break
                  if not stream_url:
                      continue
                  title = f"{home} VS {away}"
                  name = title
                  if time_label:
                      # chuẩn hoá "14:45 04/11" → "14:45 - 04/11"
                      tl = str(time_label).strip()
                      if " - " not in tl and " " in tl:
                          tl = tl.replace(" ", " - ", 1)
                      name = f"{tl} | {title}"
                  if blv:
                      name = f"{name} | {blv}"
                  if league and league != label:
                      name = name.replace(title, f"{title} ({league})", 1)
                  out.append({
                      "name": name,
                      "group": league or label,
                      "logo": logo if isinstance(logo, str) else "",
                      "source": source,
                      "url": stream_url,
                  })
              return out

          # Ưu tiên adviceme (đúng cặp đội). gvapi.cc đôi khi sai tên (vd Bình Phước thay Đồng Nai).
          gavang_primary = [
              ("gavang", "https://gavangtv-api.adviceme.io/api/v1/matches?webType=gavang", "Gà Vàng"),
              ("cola", "https://gavangtv-api.adviceme.io/api/v1/matches?webType=cola", "Cola"),
          ]
          gavang_counts = {}
          for key, url, label in gavang_primary:
              try:
                  data = get_json(url)
                  items = parse_gavang_style(data, key, label)
                  add_items(items, key + "-api")
                  gavang_counts[key] = len(items)
                  print("OK", key, len(items))
              except Exception as e:
                  print("ERR", key, url[:40], e)
                  gavang_counts[key] = 0
          # Fallback gvapi chỉ khi primary Gà Vàng về 0 trận
          if gavang_counts.get("gavang", 0) == 0:
              try:
                  data = get_json("https://api.gvapi.cc/api/matches")
                  items = parse_gavang_style(data, "gavang", "Gà Vàng")
                  add_items(items, "gavang-api-fallback")
                  print("OK gavang-fallback", len(items))
              except Exception as e:
                  print("ERR gavang-fallback", e)


          # --- SOOP Billiards (lịch + điểm, không m3u8) ---
          def fetch_soop_billiards():
              out = []
              try:
                  data = get_json("https://billiards.sooplive.com/api/games")
              except Exception as e:
                  print("ERR soop-bida games", e)
                  return out
              games = data.get("list") or []
              # Ưu tiên giải đang PLAYING, tối đa 3 giải
              playing = [g for g in games if (g.get("game_status") or "").upper() == "PLAYING"]
              if not playing:
                  playing = games[:2]
              for g in playing[:3]:
                  gno = g.get("game_no")
                  if not gno:
                      continue
                  title = g.get("title_en") or g.get("title_ko") or f"Billiards {gno}"
                  try:
                      md = get_json(f"https://billiards.sooplive.com/api/game/{gno}/matches")
                  except Exception as e:
                      print("ERR soop-bida matches", gno, e)
                      continue
                  matches = md.get("match_list") or []
                  # Giới hạn: live + sắp tới + mới xong trong ngày (tránh hàng trăm trận)
                  from datetime import datetime, timezone, timedelta
                  now = datetime.utcnow()
                  kept = 0
                  for m in matches:
                      st = (m.get("match_status") or "").upper()
                      dt_s = m.get("match_datetime") or ""
                      try:
                          dt = datetime.strptime(dt_s[:19], "%Y-%m-%d %H:%M:%S")
                      except Exception:
                          dt = None
                      # giữ: PLAYING/LIVE, hoặc ±36h quanh hiện tại
                      keep = st in ("PLAYING", "LIVE", "INPLAY", "RUNNING")
                      if dt:
                          delta = (dt - now).total_seconds() / 3600
                          if -12 <= delta <= 36:
                              keep = True
                      if not keep:
                          continue
                      players = m.get("player_list") or []
                      if len(players) < 2:
                          continue
                      p1 = players[0]
                      p2 = players[1]
                      home = p1.get("name_en") or p1.get("nick") or p1.get("name_ko") or "?"
                      away = p2.get("name_en") or p2.get("nick") or p2.get("name_ko") or "?"
                      hs = p1.get("total_score")
                      aws = p2.get("total_score")
                      logo = p1.get("photo") or g.get("logo_url") or ""
                      if dt:
                          time_label = dt.strftime("%H:%M - %d/%m")
                      else:
                          time_label = ""
                      status_map = {
                          "FINISHED": "finished",
                          "PLAYING": "live",
                          "LIVE": "live",
                          "INPLAY": "live",
                          "SCHEDULED": "scheduled",
                          "READY": "scheduled",
                          "WAITING": "scheduled",
                      }
                      mstatus = status_map.get(st, "scheduled")
                      name = f"{time_label} | {home} VS {away} ({title})" if time_label else f"{home} VS {away} ({title})"
                      out.append({
                          "name": name,
                          "group": title,
                          "logo": logo if isinstance(logo, str) else "",
                          "source": "soop_bida",
                          "type": "event_link",
                          "url": f"https://billiards.sooplive.com/schedule/{gno}",
                          "home_score": hs,
                          "away_score": aws,
                          "match_status": mstatus,
                          "start_time": (dt.strftime("%Y-%m-%dT%H:%M:%SZ") if dt else None),
                      })
                      kept += 1
                      if kept >= 40:
                          break
                  print("soop-bida game", gno, "kept", kept, "/", len(matches))
              return out

          try:
              bida_items = fetch_soop_billiards()
              # không qua add_items (cần url không phải m3u8)
              for ch in bida_items:
                  all_ch.append(ch)
              print("OK soop-bida", len(bida_items))
          except Exception as e:
              print("ERR soop-bida", e)


          # SH-16/SH-17/SH-26: validate stream URL (HLS HTTPS only)
          import ipaddress

          def validate_stream_url(u):
              try:
                  p = urlparse(u)
                  if p.scheme != "https":
                      return False
                  if not p.hostname or p.username or p.password:
                      return False
                  try:
                      ip = ipaddress.ip_address(p.hostname)
                      if not ip.is_global:
                          return False
                  except ValueError:
                      pass  # hostname DNS — OK
                  path = (p.path or "").lower()
                  if not path.endswith(".m3u8"):
                      return False
                  if path.endswith(".flv"):
                      return False
                  return True
              except Exception:
                  return False

          # SH-22: tách stream vs event_link (không trộn upcoming page vào channels)
          streams = []
          event_links = []
          for ch in all_ch:
              u = ch.get("url") or ""
              item = dict(ch)
              if validate_stream_url(u):
                  item["type"] = "stream"
                  streams.append(item)
              elif (item.get("source") == "soop_bida") or (
                  u.startswith("https://") and "billiards.sooplive.com" in u
              ):
                  item["type"] = "event_link"
                  event_links.append(item)
              elif u.startswith("https://") and "/upcoming/" in u:
                  item["type"] = "event_link"
                  event_links.append(item)
              else:
                  print("drop url", u[:80])

          # SH-15/SH-23: Quality Gate — so sánh cùng loại (streams vs streams)
          MIN_STREAMS = 5
          MIN_RETENTION_RATIO = 0.50
          prev_stream_count = 0
          prev_event_count = 0
          try:
              with open("channels.json", "r", encoding="utf-8") as f:
                  prev = json.load(f)
              if isinstance(prev.get("streams"), list):
                  prev_stream_count = len(prev["streams"])
              else:
                  # Migration: snapshot cũ — chỉ đếm URL .m3u8
                  old = prev.get("channels") or []
                  prev_stream_count = sum(
                      1 for c in old
                      if str((c or {}).get("url") or "").lower().split("?")[0].endswith(".m3u8")
                  )
              if isinstance(prev.get("event_links"), list):
                  prev_event_count = len(prev["event_links"])
          except Exception:
              prev_stream_count = 0
              prev_event_count = 0

          status = "updated"
          reason = "ok"
          if len(streams) < MIN_STREAMS:
              status = "skipped_quality_gate"
              reason = "insufficient_valid_streams"
          elif prev_stream_count and len(streams) < prev_stream_count * MIN_RETENTION_RATIO:
              status = "skipped_quality_gate"
              reason = "unexpected_stream_count_drop"

          print(
              "gate", status, reason,
              "streams", len(streams), "prev_streams", prev_stream_count,
              "events", len(event_links), "prev_events", prev_event_count,
          )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY") or "/dev/null"
          with open(summary_path, "a", encoding="utf-8") as sm:
              sm.write(
                  "### Channels quality gate\n"
                  f"- status: `{status}`\n"
                  f"- reason: `{reason}`\n"
                  f"- current_stream_count: {len(streams)}\n"
                  f"- previous_stream_count: {prev_stream_count}\n"
                  f"- current_event_count: {len(event_links)}\n"
                  f"- previous_event_count: {prev_event_count}\n"
                  f"- previous_snapshot_preserved: {status != 'updated'}\n"
              )

          if status != "updated":
              raise SystemExit(0)

          out = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "count": len(streams),
              "channels": streams,
              "streams": streams,
              "event_links": event_links,
          }
          with open("channels.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("saved", len(streams), "streams,", len(event_links), "event_links")
          PY


      - name: Enrich scores (API-Football → scores.json)
        if: always()
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python3 << 'PY'
          import json, os, ssl, time, urllib.request, urllib.parse
          from datetime import datetime, timedelta, timezone

          KEY = (os.environ.get("API_FOOTBALL_KEY") or "").strip()
          CTX = ssl.create_default_context()
          OUT = "scores.json"

          def load_prev():
              try:
                  with open(OUT, encoding="utf-8") as f:
                      d = json.load(f)
                  return d if isinstance(d, dict) else {"items": []}
              except Exception:
                  return {"items": [], "updated_at": None}

          prev = load_prev()
          if not KEY:
              print("SKIP API-Football: secret API_FOOTBALL_KEY chưa cấu hình")
              # giữ file cũ nếu có
              if not os.path.exists(OUT):
                  with open(OUT, "w", encoding="utf-8") as f:
                      json.dump({"updated_at": None, "items": [], "note": "no_api_key"}, f)
              raise SystemExit(0)

          def api_get(path, params=None):
              q = ("?" + urllib.parse.urlencode(params)) if params else ""
              url = "https://v3.football.api-sports.io" + path + q
              req = urllib.request.Request(
                  url,
                  headers={
                      "x-apisports-key": KEY,
                      "Accept": "application/json",
                      "User-Agent": "SportsH-Workflow/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=45, context=CTX) as r:
                  return json.load(r)

          def norm(s):
              import unicodedata, re
              s = unicodedata.normalize("NFD", str(s or "").lower())
              s = "".join(c for c in s if unicodedata.category(c) != "Mn")
              return re.sub(r"[^a-z0-9]+", " ", s).strip()

          # SH-29/30: tách timestamp + giảm quota
          items = []
          seen = set()
          today = datetime.now(timezone.utc).date()
          request_count = 0
          live_fetched_at = prev.get("live_fetched_at")
          fixtures_fetched_at = prev.get("fixtures_fetched_at")

          def age_minutes(ts):
              if not ts:
                  return 1e9
              try:
                  from datetime import datetime as _dt
                  pt = _dt.strptime(str(ts).replace("Z", "").split(".")[0], "%Y-%m-%dT%H:%M:%S")
                  return (datetime.utcnow() - pt).total_seconds() / 60.0
              except Exception:
                  return 1e9

          # Fixtures theo ngày: chỉ gọi nếu chưa có hoặc > 6 giờ (không 288 req/ngày)
          fetch_fixtures = age_minutes(fixtures_fetched_at) >= 360 or not (prev.get("items") or [])
          day_ok = {}  # day -> bool success
          if fetch_fixtures:
              for delta in (0, -1):
                  day = (today + timedelta(days=delta)).isoformat()
                  day_ok[day] = False
                  try:
                      data = api_get("/fixtures", {"date": day})
                      request_count += 1
                  except Exception as e:
                      print("API err", day, e)
                      # SH-38: giữ items cũ của đúng ngày
                      for it in prev.get("items") or []:
                          if str(it.get("date") or "") == day and it.get("status") != "live":
                              key = norm(it.get("home")) + "|" + norm(it.get("away")) + "|" + day
                              if key not in seen:
                                  seen.add(key)
                                  items.append(it)
                      continue
                  # SH-37: response hợp lệ (có key response, không errors nghiêm trọng)
                  if not isinstance(data, dict) or "response" not in data:
                      print("API invalid payload", day)
                      for it in prev.get("items") or []:
                          if str(it.get("date") or "") == day and it.get("status") != "live":
                              key = norm(it.get("home")) + "|" + norm(it.get("away")) + "|" + day
                              if key not in seen:
                                  seen.add(key)
                                  items.append(it)
                      continue
                  errs = data.get("errors")
                  if errs and (isinstance(errs, dict) and len(errs) or isinstance(errs, list) and len(errs)):
                      print("API errors payload", day, errs)
                      for it in prev.get("items") or []:
                          if str(it.get("date") or "") == day and it.get("status") != "live":
                              key = norm(it.get("home")) + "|" + norm(it.get("away")) + "|" + day
                              if key not in seen:
                                  seen.add(key)
                                  items.append(it)
                      continue
                  resp = data.get("response") or []
                  day_ok[day] = True
                  print("fixtures", day, len(resp))
                  for row in resp:
                      fx = row.get("fixture") or {}
                      teams = row.get("teams") or {}
                      goals = row.get("goals") or {}
                      st = ((fx.get("status") or {}).get("short") or "").upper()
                      home = ((teams.get("home") or {}).get("name")) or ""
                      away = ((teams.get("away") or {}).get("name")) or ""
                      if not home or not away:
                          continue
                      key = norm(home) + "|" + norm(away) + "|" + day
                      if key in seen:
                          continue
                      seen.add(key)
                      hs, aws = goals.get("home"), goals.get("away")
                      status_out = "finished" if st in ("FT", "AET", "PEN") else (
                          "live" if st in ("1H", "2H", "HT", "ET", "BT", "P", "LIVE") else "scheduled"
                      )
                      items.append({
                          "home": home,
                          "away": away,
                          "home_score": hs,
                          "away_score": aws,
                          "status": status_out,
                          "date": day,
                          "league": ((row.get("league") or {}).get("name")) or "",
                          "api_status": st,
                          "fixture_id": fx.get("id"),
                      })
                  time.sleep(0.35)
              # SH-37: chỉ cập nhật timestamp nếu ít nhất 1 ngày thành công
              if any(day_ok.values()):
                  fixtures_fetched_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                  print("fixtures_fetched_at updated", day_ok)
              else:
                  print("fixtures_fetched_at NOT updated — all days failed")
          else:
              print("SKIP fixtures by date — age_min", round(age_minutes(fixtures_fetched_at), 1))
              for it in prev.get("items") or []:
                  if it.get("status") != "live":
                      key = norm(it.get("home")) + "|" + norm(it.get("away")) + "|" + str(it.get("date") or "")
                      if key not in seen:
                          seen.add(key)
                          items.append(it)

          # Live: throttle theo live_fetched_at (KHÔNG dùng updated_at)
          fetch_live = age_minutes(live_fetched_at) >= 25
          if not fetch_live:
              print("SKIP live endpoint — live_fetched_at age", round(age_minutes(live_fetched_at), 1), "min < 25")
              for it in prev.get("items") or []:
                  if it.get("status") == "live":
                      key = norm(it.get("home")) + "|" + norm(it.get("away")) + "|" + str(it.get("date") or "")
                      if key not in seen:
                          seen.add(key)
                          items.append(it)
                      else:
                          # cập nhật score từ bản live cũ vào items
                          for j, cur in enumerate(items):
                              if norm(cur.get("home")) == norm(it.get("home")) and norm(cur.get("away")) == norm(it.get("away")):
                                  if it.get("home_score") is not None:
                                      items[j] = dict(cur)
                                      items[j]["home_score"] = it.get("home_score")
                                      items[j]["away_score"] = it.get("away_score")
                                      items[j]["status"] = "live"
                                      items[j]["api_status"] = it.get("api_status") or items[j].get("api_status")
                                  break
          else:
              try:
                  data = api_get("/fixtures", {"live": "all"})
                  request_count += 1
                  for row in data.get("response") or []:
                      fx = row.get("fixture") or {}
                      teams = row.get("teams") or {}
                      goals = row.get("goals") or {}
                      home = ((teams.get("home") or {}).get("name")) or ""
                      away = ((teams.get("away") or {}).get("name")) or ""
                      if not home or not away:
                          continue
                      day = (fx.get("date") or "")[:10]
                      key = norm(home) + "|" + norm(away) + "|" + day
                      fid = fx.get("id")
                      if key in seen:
                          for it in items:
                              if norm(it["home"]) == norm(home) and norm(it["away"]) == norm(away):
                                  it["home_score"] = goals.get("home")
                                  it["away_score"] = goals.get("away")
                                  it["status"] = "live"
                                  it["api_status"] = ((fx.get("status") or {}).get("short")) or it.get("api_status")
                                  if fid:
                                      it["fixture_id"] = fid
                                  break
                          continue
                      seen.add(key)
                      items.append({
                          "home": home,
                          "away": away,
                          "home_score": goals.get("home"),
                          "away_score": goals.get("away"),
                          "status": "live",
                          "date": day,
                          "league": ((row.get("league") or {}).get("name")) or "",
                          "api_status": ((fx.get("status") or {}).get("short")) or "",
                          "fixture_id": fid,
                      })
                  live_fetched_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                  print("live fixtures merged", len(data.get("response") or []))
              except Exception as e:
                  print("live fetch skip", e)
                  # không cập nhật live_fetched_at khi lỗi

          print("API-Football request_count", request_count)

                    # Quality: không ghi rỗng nếu trước đó có data
          if not items and prev.get("items"):
              print("WARN: API-Football empty — keep previous scores.json")
              raise SystemExit(0)

          out = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "fixtures_fetched_at": fixtures_fetched_at,
              "live_fetched_at": live_fetched_at,
              "request_count": request_count,
              "count": len(items),
              "source": "api-football",
              "items": items,
          }
          with open(OUT, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("saved scores.json", len(items))
          PY


      # Commit độc lập theo file đã đổi (matches / channels có thể cập nhật riêng)
      - name: Commit data files
        if: always()
        run: |
          git config user.name "SportsH Bot"
          git config user.email "bot@sportsh.local"
          CHANGED=""
          if git diff --quiet matches.json 2>/dev/null; then
            true
          else
            git add matches.json
            CHANGED="$CHANGED matches"
          fi
          if git diff --quiet channels.json 2>/dev/null; then
            true
          else
            git add channels.json
            CHANGED="$CHANGED channels"
          fi
          if git diff --quiet scores.json 2>/dev/null; then
            true
          else
            git add scores.json
            CHANGED="$CHANGED scores"
          fi
          if [ -z "$CHANGED" ]; then
            echo "No data file changes to commit"
            exit 0
          fi
          git commit -m "chore: update$CHANGED"
          git push
          echo "Committed:$CHANGED"
