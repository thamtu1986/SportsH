name: Update matches.json

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch matches from xoiche
        run: |
          python3 << 'PY'
          import json, urllib.request, time

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 SportsH-Bot",
                  "Accept": "application/json",
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          base = "https://xoiche.live"
          url = base + "/api/matches/?ordering=smart&page_size=100&site=xoiche"
          results = []
          for _ in range(8):
              data = get(url)
              results.extend(data.get("results") or [])
              nxt = data.get("next")
              if not nxt:
                  break
              url = nxt if nxt.startswith("http") else base + nxt
              time.sleep(0.2)

          def has_stream(m):
              def ok(u):
                  return u and ".m3u8" in str(u)
              if ok(m.get("primary_stream_url")) or ok(m.get("backup_stream_url")):
                  return True
              for c in m.get("commentators") or []:
                  if ok(c.get("stream_url")) or ok(c.get("flv_stream_url")):
                      return True
              for c in m.get("commentator_streams") or []:
                  if ok(c.get("stream_url")):
                      return True
                  if ok((c.get("commentator") or {}).get("stream_url")):
                      return True
              return False

          watch = [m for m in results if has_stream(m)]
          out = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "count": len(watch),
              "results": watch,
          }
          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("saved", len(watch), "matches")
          PY

      - name: Fetch channels from bongda-1
        run: |
          python3 << 'PY'
          import json, urllib.request, time, re

          def get_text(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 SportsH-Bot",
                  "Accept": "*/*",
              })
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read().decode("utf-8", "replace")

          def parse(text, source):
              out = []
              cur = None
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith("#EXTINF:"):
                      comma = line.find(",")
                      meta = line[:comma] if comma >= 0 else line
                      name = line[comma+1:].strip() if comma >= 0 else "Kênh"
                      g = re.search(r'group-title="([^"]*)"', meta, re.I)
                      l = re.search(r'tvg-logo="([^"]*)"', meta, re.I)
                      cur = {
                          "name": name,
                          "group": g.group(1) if g else "",
                          "logo": l.group(1) if l else "",
                          "source": source,
                          "url": "",
                      }
                  elif not line.startswith("#") and cur is not None:
                      if line.startswith("http"):
                          cur["url"] = line
                          out.append(cur)
                      cur = None
              return out

          sources = {
              "giovang": "https://bongda-1.onrender.com/giovang.m3u",
              "cola": "https://bongda-1.onrender.com/cola.m3u",
              "phalang": "https://bongda-1.onrender.com/phalang.m3u",
          }
          all_ch = []
          seen = set()
          for k, url in sources.items():
              try:
                  items = parse(get_text(url), k)
                  print(k, len(items))
                  for ch in items:
                      if ch["url"] in seen:
                          continue
                      seen.add(ch["url"])
                      all_ch.append(ch)
              except Exception as e:
                  print("ERR", k, e)

          out = {
              "updated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "count": len(all_ch),
              "channels": all_ch,
          }
          with open("channels.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print("saved", len(all_ch), "channels")
          PY

      - name: Commit data files
        run: |
          git config user.name "SportsH Bot"
          git config user.email "bot@sportsh.local"
          git add matches.json channels.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update matches.json and channels.json"
            git push
          fi
